<!doctype html>
<html lang="en" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Mobile viewport with safe area support - zoom enabled for accessibility.
         `interactive-widget=resizes-content` makes the on-screen keyboard shrink
         the layout viewport, so the `h-dvh` app shell keeps the conversation
         composer above it instead of behind it. Browsers that ignore the hint
         (iOS Safari) are handled by the measured inset in keyboard-inset.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- PWA theme color - updated dynamically by ThemeProvider -->
    <meta name="theme-color" content="#075E54" />
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WATeamInbox" />
    <!-- Android specific -->
    <meta name="mobile-web-app-capable" content="yes" />
    <title>WATeamInbox</title>
    <!-- FOUC Prevention: Apply dark mode before React renders -->
    <script>
      (function() {
        var STORAGE_KEY = 'wateaminbox-theme';
        var VALID_THEMES = ['light', 'dark', 'system'];
        var theme = 'system';

        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored && VALID_THEMES.indexOf(stored) !== -1) {
            theme = stored;
          }
        } catch (_e) {
          // localStorage not available (privacy mode, incognito)
        }

        var isDark = false;
        if (theme === 'dark') {
          isDark = true;
        } else if (theme === 'system') {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          // Update theme-color meta for dark mode
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#111B21');
        }
      })();
    </script>
    <!-- Pre-React splash. The entry bundle is large enough that, on a cold
         visit, #root would otherwise sit blank while it downloads and executes.
         These styles are inlined (not in the app stylesheet) and the markup
         lives inside #root, so the loader paints as soon as the document does
         and React removes it on its first render (createRoot clears #root).
         The --splash-bg follows the theme the FOUC script resolved above, so
         there is no white flash in dark mode. -->
    <style>
      :root { --splash-bg: #ffffff; --splash-fg: #00a884; }
      html.dark { --splash-bg: #111b21; }
      html, body { margin: 0; height: 100%; background: var(--splash-bg); }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
      }
      #app-splash .app-splash-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(0, 168, 132, 0.22);
        border-top-color: var(--splash-fg);
        animation: app-splash-spin 0.7s linear infinite;
      }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash-spinner { animation-duration: 1.8s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <div class="app-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
