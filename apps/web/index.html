<!doctype html>
<html lang="en" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Mobile viewport with safe area support - zoom enabled for accessibility.
         `interactive-widget=resizes-content` makes the on-screen keyboard shrink
         the layout viewport, so the `h-dvh` app shell keeps the conversation
         composer above it instead of behind it. Browsers that ignore the hint
         (iOS Safari) are handled by the measured inset in keyboard-inset.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- PWA theme color - updated dynamically by ThemeProvider -->
    <meta name="theme-color" content="#efefea" />
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WATeamInbox" />
    <!-- Android specific -->
    <meta name="mobile-web-app-capable" content="yes" />
    <title>WATeamInbox</title>
    <!-- Pre-paint theme. Keep THEMES in sync with src/lib/theme/themes.ts
         (theme-tokens.test.ts enforces it). -->
    <script>
      (function() {
        var THEMES = {
          light: ['light', '#efefea'],
          dark: ['dark', '#08090b'],
          whatsapp: ['dark', '#111b21']
        };
        var pref = 'system';
        try {
          var stored = localStorage.getItem('wateaminbox-theme');
          if (stored === 'system' || THEMES.hasOwnProperty(stored)) pref = stored;
        } catch (_e) {}
        var id = pref;
        if (pref === 'system') {
          id = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        root.style.colorScheme = THEMES[id][0];
        if (THEMES[id][0] === 'dark') root.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', THEMES[id][1]);
      })();
    </script>
    <!-- Pre-React splash. The entry bundle is large enough that, on a cold
         visit, #root would otherwise sit blank while it downloads and executes.
         These styles are inlined (not in the app stylesheet) and the markup
         lives inside #root, so the loader paints as soon as the document does
         and React removes it on its first render (createRoot clears #root).
         The --splash-bg follows the theme the FOUC script resolved above, so
         there is no white flash in dark mode. -->
    <style>
      :root { --splash-bg: #efefea; --splash-fg: #1a1a19; }
      html[data-theme="dark"] { --splash-bg: #08090b; --splash-fg: #ececee; }
      html[data-theme="whatsapp"] { --splash-bg: #111b21; --splash-fg: #00a884; }
      html, body { margin: 0; height: 100%; background: var(--splash-bg); }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
      }
      #app-splash .app-splash-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(0, 168, 132, 0.22);
        border-top-color: var(--splash-fg);
        animation: app-splash-spin 0.7s linear infinite;
      }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash-spinner { animation-duration: 1.8s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <div class="app-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
