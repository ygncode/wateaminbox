<!doctype html>
<html lang="en" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Mobile viewport with safe area support - zoom enabled for accessibility -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA theme color - updated dynamically by ThemeProvider -->
    <meta name="theme-color" content="#075E54" />
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WATeamInbox" />
    <!-- Android specific -->
    <meta name="mobile-web-app-capable" content="yes" />
    <title>WATeamInbox</title>
    <!-- FOUC Prevention: Apply dark mode before React renders -->
    <script>
      (function() {
        var STORAGE_KEY = 'wateaminbox-theme';
        var VALID_THEMES = ['light', 'dark', 'system'];
        var theme = 'system';

        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored && VALID_THEMES.indexOf(stored) !== -1) {
            theme = stored;
          }
        } catch (_e) {
          // localStorage not available (privacy mode, incognito)
        }

        var isDark = false;
        if (theme === 'dark') {
          isDark = true;
        } else if (theme === 'system') {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          // Update theme-color meta for dark mode
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#111B21');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
