global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 3s
  timeout client 30s
  timeout server 30s
  timeout check 3s

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s
  hold obsolete 10s

frontend api_http
  bind :4451
  default_backend api_replicas

backend api_replicas
  balance roundrobin
  option forwardfor
  option httpchk
  http-check send meth GET uri /api/health/ready
  http-check expect status 200
  default-server inter 5s fall 2 rise 2
  # Docker DNS returns one A record per scaled `api` container. Ten bounded
  # slots match API_REPLICA_COUNT's production validation ceiling.
  server-template api 1-10 api:4445 check resolvers docker init-addr libc,none
