name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Public pull-request code must not execute on maintainer infrastructure.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Synthetic test-only keys. Production secrets must never be stored in Actions YAML.
      JWT_SECRET: ci-test-only-not-a-secret-at-least-32-characters
      CENTRIFUGO_TOKEN_HMAC_SECRET: ci-test-only-realtime-secret-at-least-32-characters
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wateaminbox
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            services/shared/go.sum
            services/orchestrator/go.sum
            services/whatsapp/go.sum

      - name: Configure test database URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/wateaminbox" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun run test:db-contracts
      - run: bun run test:sla-analytics
      - run: bun run check:unused
      - run: bun run test
      - run: bun run build -- --force
