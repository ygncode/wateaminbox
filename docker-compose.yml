services:
  postgres:
    image: postgres:18-alpine
    container_name: wateaminbox-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wateaminbox
    ports:
      - "4447:5432"
    volumes:
      # PostgreSQL 18 stores clusters in versioned subdirectories; mount its parent.
      - wateaminbox_postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: wateaminbox-nats
    command: ["--config", "/etc/nats/nats.conf"]
    ports:
      - "4448:4222"
      - "8222:8222"
    volumes:
      - wateaminbox_nats_data:/data
      - ${DEV_RUNTIME_DIR:-.dev-runtime}/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker-credential-provisioner:
    image: postgres:18-alpine
    profiles: ["setup"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wateaminbox
      POSTGRES_PASSWORD_FILE: /run/dev-secrets/postgres_password
      WORKER_POSTGRES_PASSWORD_FILE: /run/dev-secrets/worker_postgres_password
      # Existing local volumes historically use the short password "postgres".
      # This exception is development-only and is absent from production Compose.
      ALLOW_INSECURE_DEVELOPMENT_ADMIN_CREDENTIAL: "true"
    volumes:
      - ./infrastructure/postgres/provision-worker-role.sh:/usr/local/bin/provision-worker-role:ro
      - ${DEV_RUNTIME_DIR:-.dev-runtime}:/run/dev-secrets:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/provision-worker-role"]
    depends_on:
      postgres:
        condition: service_healthy

  centrifugo:
    image: centrifugo/centrifugo:v6.9.1
    container_name: wateaminbox-centrifugo
    command: ["centrifugo", "--config=/centrifugo/config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-development-centrifugo-token-secret-change-me}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-development-centrifugo-api-key}
    ports:
      - "4451:8000"
    volumes:
      - ./infrastructure/centrifugo/config.json:/centrifugo/config.json:ro
    depends_on:
      nats:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: wateaminbox-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: development_master_key
    ports:
      - "4449:7700"
    volumes:
      - wateaminbox_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: wateaminbox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "4450:9000"
      - "9001:9001"
    volumes:
      - wateaminbox_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: wateaminbox-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/whatsapp-media --ignore-existing;
      mc anonymous set none local/whatsapp-media;
      exit 0;
      "

  # NATS debugging tools
  nats-box:
    image: natsio/nats-box:latest
    container_name: wateaminbox-nats-box
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      nats:
        condition: service_healthy
    profiles:
      - debug

volumes:
  wateaminbox_postgres_data:
    name: wateaminbox_postgres_data
  wateaminbox_nats_data:
    name: wateaminbox_nats_data
  wateaminbox_meilisearch_data:
    name: wateaminbox_meilisearch_data
  wateaminbox_minio_data:
    name: wateaminbox_minio_data
