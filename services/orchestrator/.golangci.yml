run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - gosec
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    check-shadowing: true
  goimports:
    local-prefixes: github.com/ygncode-lab/whatsapp-web
  revive:
    rules:
      - name: exported
        severity: warning
  gosec:
    excludes:
      - G104 # Errors unhandled - we use errcheck for this

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
